name: Verify web and backend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Pages delivery is retired. This workflow verifies code without publishing assets.
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'verify-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm --dir functions install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check backend and integration types
        run: pnpm backend:build
