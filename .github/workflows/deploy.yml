name: Verify web and backend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Pages delivery is retired. Only gated, verified main artifacts reach Hosting.
permissions:
  contents: read

# Serialize main releases; cancel superseded pull-request verification only.
concurrency:
  group: 'verify-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm --dir functions install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install browser and Linux dependencies
        run: pnpm exec playwright install --with-deps msedge

      - name: Build backend and integration types
        run: pnpm backend:build

      - name: Verify backend in fresh demo emulators
        run: pnpm exec firebase emulators:exec --project demo-omnipraxis --only auth,firestore,storage,functions "pnpm backend:test"

      - name: Verify portal in fresh demo emulators
        run: pnpm exec firebase emulators:exec --project demo-omnipraxis --only auth,firestore,storage,functions "pnpm portal:test"

      - name: Verify upstream viewer compatibility and desktop renderer
        run: pnpm viewer:check

      - name: Verify Hosting deep links and binary exclusion
        run: pnpm hosting:check

      - run: pnpm release:test
      - run: pnpm release:record
      - run: pnpm release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: angular-portal-${{ github.sha }}
          path: |
            build/portal/browser
            build/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/portal-tests
            build/portal-report
            build/viewer-compat/browser-results
            build/viewer-compat/*.json
          if-no-files-found: ignore
          retention-days: 7

  deploy_hosting:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CLOUD_CUTOVER_READY == 'true' }}
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Download this run's verified portal
        uses: actions/download-artifact@v8
        with:
          name: angular-portal-${{ github.sha }}
          path: build
      - name: Verify artifact integrity and source commit
        run: |
          pnpm release:verify
          node --input-type=module -e "import assert from 'node:assert/strict'; import { readFileSync } from 'node:fs'; const manifest = JSON.parse(readFileSync('build/release-manifest.json', 'utf8')); assert.equal(manifest.commit, process.env.GITHUB_SHA); assert.equal(manifest.dirty, false);"
      - run: pnpm portal:configure config/portal-config.production.json
      - run: pnpm release:record
      - run: pnpm release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: angular-live-candidate-${{ github.sha }}
          path: |
            build/portal/browser
            build/release-manifest.json
          retention-days: 7
          if-no-files-found: error
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMNIPRAXIS_F8141 }}
          channelId: live
          projectId: omnipraxis-f8141
