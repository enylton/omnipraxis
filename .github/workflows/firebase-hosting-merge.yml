name: Deploy reviewed Angular portal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_and_deploy:
    if: ${{ vars.CLOUD_CUTOVER_READY == 'true' }}
    environment: firebase-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir functions install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm backend:build
      - run: pnpm portal:configure
        env:
          PORTAL_CONFIG_JSON: ${{ vars.PORTAL_CONFIG_JSON }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMNIPRAXIS_F8141 }}
          channelId: live
          projectId: omnipraxis-f8141
